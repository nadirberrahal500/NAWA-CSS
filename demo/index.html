<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nawa CSS — معاينة</title>
  <link rel="stylesheet" href="../src/nexa.css">
</head>
<body>
  <main class="nx-container nx-stack" style="padding-block: var(--nx-space-xl)">
    <h1>Nawa CSS <span class="nx-badge">v0.1</span></h1>
    <p class="nx-text-muted">إطار CSS سائل، تلقائي، يدعم RTL وMaterial Icons.</p>
    <div class="nx-cluster">
      <button class="nx-btn nx-btn--primary"><span class="nx-icon">bolt</span> إجراء رئيسي</button>
      <button class="nx-btn"><span class="nx-icon">star</span> عادي</button>
      <button class="nx-btn nx-btn--ghost">شفاف</button>
    </div>
    <div class="nx-grid">
      <div class="nx-card"><h3>بطاقة ١</h3><p class="nx-text-muted">تتوسّع تلقائيًا.</p></div>
      <div class="nx-card"><h3>بطاقة ٢</h3><p class="nx-text-muted">بدون قياسات يدوية.</p></div>
      <div class="nx-card"><h3>بطاقة ٣</h3><p class="nx-text-muted">RTL جاهز.</p></div>
    </div>
    <input class="nx-input" placeholder="اكتب هنا…">
  </main>
</body>
</html>
